<!DOCTYPE html>
<html lang="am">
<head><meta charset="UTF-8"><title>የኮፒ ቤት መቆጣጠሪያ</title></head>
<body>
    <h1>መረጃ መመዝገቢያ</h1>
    <input type="text" id="memberId" placeholder="የአባል መታወቂያ">
    <input type="text" id="status" placeholder="ሁኔታ">
    <input type="number" id="quantity" placeholder="ብዛት">
    <button onclick="saveData()">መዝግብ</button>
    <div id="result"></div>
    <script>
        async function saveData() {
            const data = {
                memberId: document.getElementById('memberId').value,
                status: document.getElementById('status').value,
                quantity: document.getElementById('quantity').value
            };
            await fetch('/api/copy-shop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            loadData();
        }
        async function loadData() {
            const res = await fetch('/api/copy-shop');
            const data = await res.json();
            document.getElementById('result').innerText = JSON.stringify(data);
        }
        loadData();
    </script>
</body>
</html>
