<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የኮፒ ቤት መቆጣጠሪያ</title>
</head>
<body>
    <h1>መረጃ መመዝገቢያ</h1>
    <input type="text" id="memberId" placeholder="የአባል መታወቂያ">
    <input type="text" id="status" placeholder="ሁኔታ (Status)">
    <input type="number" id="quantity" placeholder="የወረቀት ብዛት">
    <button onclick="saveData()">መዝግብ</button>

    <h2>የተመዘገቡ መረጃዎች</h2>
    <div id="result"></div>

    <script>
       const API_URL = 'https://social-committee-api-cd7s.vercel.app';

        async function saveData() {
            const data = {
                memberId: document.getElementById('memberId').value,
                status: document.getElementById('status').value,
                quantity: document.getElementById('quantity').value
            };

            const response = await fetch(`${API_URL}/api/copy-shop`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('መረጃው ተመዝግቧል!');
                loadData();
            } else {
                alert('መመዝገብ አልተቻለም');
            }
        }

        async function loadData() {
            const response = await fetch(`${API_URL}/api/copy-shop`);
            const data = await response.json();
            document.getElementById('result').innerText = JSON.stringify(data);
        }

        loadData(); // ገጹ እንደተከፈተ መረጃውን ያሳይ
    </script>
</body>
</html>
